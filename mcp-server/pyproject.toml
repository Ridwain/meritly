[project]
name = "meritly-mcp"
version = "0.1.0"
description = "Production-oriented MCP server for Meritly"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastmcp==3.4.5",
  "httpx==0.28.1",
  "pydantic-settings>=2.10,<3",
  "py-key-value-aio[redis,wrappers-encryption]==0.4.5",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
]

[project.scripts]
meritly-mcp = "meritly_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meritly_mcp"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"
